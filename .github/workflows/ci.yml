name: CI & Zero-Hallucination Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build 500k SQLite DB & Run 18 Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build SQLite FTS5 Database (500k deals)
        run: python db_builder.py

      - name: Run Automated Test Suite & Latency Benchmark
        run: python test_agent.py
